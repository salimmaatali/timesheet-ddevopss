
#http://localhost:8082/timesheet-devops/user/retrieve-all-users

#Server configuration
server.servlet.context-path=/timesheet-devops

# 8080 : jenkins
# 8081 : nexus
# 8082 : projet timesheet-devops
# 9000 : sonarqube
# 9090 : prometheus
# 3000 : grafana
server.port=8082

### DATABASE ###
# En local : MySQL sur localhost:3306.
# Dans docker-compose, ces valeurs sont remplacees par les variables d'environnement
# SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/timesheet-devops-db?createDatabaseIfNotExist=true&useUnicode=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
### JPA / HIBERNATE ###
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

### ACTUATOR / PROMETHEUS ###
# http://localhost:8082/timesheet-devops/actuator/prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=timesheet-devops

#logging configuration (console : visible avec "docker logs timesheet-app")
logging.level.com.zaxxer.hikari=warn
logging.level.org.springframework=warn
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %-5level - %logger{60} - %msg%n

# TRACE DEBUG INFO WARN ERROR FATAL
