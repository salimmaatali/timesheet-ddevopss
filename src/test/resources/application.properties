# Configuration utilisee UNIQUEMENT pendant "mvn test" (elle remplace celle de src/main).
# Base H2 en memoire : pas besoin de MySQL sur la machine Jenkins.
server.servlet.context-path=/timesheet-devops
spring.datasource.url=jdbc:h2:mem:timesheetdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
management.endpoints.web.exposure.include=health,info,prometheus
logging.level.root=WARN
